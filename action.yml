name: 'Skill Audit for Agent Files'
description: 'Static security scan of agent instruction files — SKILL.md, CLAUDE.md, AGENTS.md, .cursorrules, .windsurfrules, MCP configs'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  paths:
    description: 'Space-separated paths to audit'
    required: false
    default: '.'
  fail-on:
    description: 'Exit non-zero at this level: error, warning or none'
    required: false
    default: 'error'
  version:
    description: 'skill-audit version to run. A major range picks up fixes; pin an exact version to freeze.'
    required: false
    # A major range, not "latest": running "latest" inside someone else's CI is
    # the supply-chain risk this tool exists to flag.
    default: '1'
  upload-sarif:
    description: 'Upload SARIF to GitHub code scanning (job needs security-events: write)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run skill-audit
      shell: bash
      # continue-on-error so a failing scan still reaches the SARIF upload and
      # the verdict step. The gate itself is enforced by the last step, because
      # in a composite action the last step decides the job result.
      continue-on-error: true
      run: |
        set +e
        # Install into a throwaway prefix rather than relying on `npx <name>`.
        # npx resolves a package name that matches the current repo, which
        # shadowed the registry build and produced "skill-audit: not found"
        # (exit 127) when this Action ran inside its own repository.
        prefix="$RUNNER_TEMP/skill-audit-${{ inputs.version }}"
        npm install --prefix "$prefix" --no-save --no-fund --no-audit \
          "@mkfeuhrer/skill-audit@${{ inputs.version }}"
        "$prefix/node_modules/.bin/skill-audit" ${{ inputs.paths }} \
          --fail-on "${{ inputs.fail-on }}" \
          --format sarif > skill-audit.sarif
        echo "scan_exit=$?" >> "$GITHUB_OUTPUT"
      id: scan

    - name: Summarize findings
      if: always()
      shell: bash
      run: |
        if [ -f skill-audit.sarif ] && [ -s skill-audit.sarif ]; then
          # readFile+JSON.parse, not require(): require() only parses .json as
          # JSON and throws on a .sarif extension.
          node -e "
            const fs = require('node:fs')
            const s = JSON.parse(fs.readFileSync('skill-audit.sarif', 'utf8'))
            const r = s.runs?.[0]?.results ?? []
            const counts = r.reduce((acc, x) => {
              const lvl = x.level || 'warning'
              acc[lvl] = (acc[lvl] || 0) + 1
              return acc
            }, {})
            const parts = Object.entries(counts).map(([k, v]) => v + ' ' + k)
            console.log('skill-audit: ' + (parts.length ? parts.join(', ') : 'no findings'))
          "
        fi

    - name: Upload SARIF
      # always(): upload the findings that failed the gate. Without this the
      # report is lost exactly when it matters.
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: skill-audit.sarif

    - name: Enforce the gate
      shell: bash
      # Last step decides the job result, which is how the gate survives
      # continue-on-error above.
      run: |
        code="${{ steps.scan.outputs.scan_exit }}"
        if [ "${{ inputs.fail-on }}" = "none" ]; then
          echo "fail-on: none — not failing the job"
          exit 0
        fi
        if [ -z "$code" ]; then
          echo "skill-audit did not report an exit code; treating as failure"
          exit 1
        fi
        if [ "$code" != "0" ]; then
          echo "skill-audit found issues at or above '${{ inputs.fail-on }}' (exit $code)"
          exit "$code"
        fi
        echo "skill-audit: clean"
