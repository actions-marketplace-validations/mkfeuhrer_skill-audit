name: release

on:
  push:
    # Only full version tags (v1.2.3). A floating `v1` tag exists for the
    # Action reference, not a release, and it used to re-trigger this workflow.
    # These are glob patterns, not regex.
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). No long-lived token is
      # stored: the runner exchanges a short-lived OIDC token for publish
      # rights, scoped to this workflow and unreusable elsewhere.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Never cache in a release build; a poisoned cache could alter what ships.
          package-manager-cache: false

      # Trusted publishing needs npm CLI >= 11.5.1.
      - run: npm install -g npm@latest

      - run: node --test test/*.test.mjs

      # Tags can point at a commit whose version is already on the registry
      # (a manual publish, a re-tag, or a floating tag). Publishing again would
      # fail with a 403, so treat that as a no-op success instead of a red X.
      - id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@mkfeuhrer/skill-audit@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@mkfeuhrer/skill-audit@$version is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN: an empty one makes npm fall back to token auth and
      # fail with ENEEDAUTH. Trusted publishing authenticates via OIDC, and
      # npm generates provenance automatically for public repos.
      - if: steps.published.outputs.exists == 'false'
        run: npm publish
